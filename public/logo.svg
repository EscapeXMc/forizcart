<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- No background rects = Transparent background -->
  
  <defs>
    <!-- Realistic Leaf Gradient -->
    <linearGradient id="leafBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="40%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>

    <!-- Vein Shadow/Highlight Filter for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Organic Realistic Leaf Path with Serrated Edges -->
  <path d="M256 60 
           C 275 80, 290 85, 310 80 
           C 330 95, 345 110, 365 115 
           C 385 135, 400 160, 410 190 
           C 420 220, 415 250, 405 280 
           C 395 310, 375 340, 350 370 
           C 325 400, 290 430, 256 460 
           C 222 430, 187 400, 162 370 
           C 137 340, 117 310, 107 280 
           C 97 250, 92 220, 102 190 
           C 112 160, 127 135, 147 115 
           C 167 110, 182 95, 202 80 
           C 222 85, 237 80, 256 60 Z" 
        fill="url(#leafBase)" 
        stroke="#081c15" 
        stroke-width="2" 
        opacity="0.95"/>

  <!-- Detailed Central Midrib -->
  <path d="M256 75 L256 448" stroke="#74c69d" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M256 75 L256 448" stroke="#d8f3dc" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Complex Branching Lateral Veins (Right Side) -->
  <path d="M256 130 C 285 125, 330 135, 360 115" stroke="#74c69d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M256 170 C 290 175, 340 185, 385 160" stroke="#74c69d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M256 215 C 300 220, 350 235, 400 205" stroke="#74c69d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M256 260 C 300 270, 355 290, 395 260" stroke="#74c69d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M256 305 C 295 320, 340 345, 375 320" stroke="#74c69d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M256 350 C 285 365, 315 390, 340 375" stroke="#74c69d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M256 395 C 275 405, 290 425, 305 420" stroke="#74c69d" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Complex Branching Lateral Veins (Left Side) -->
  <path d="M256 130 C 227 125, 182 135, 152 115" stroke="#74c69d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M256 170 C 222 175, 172 185, 127 160" stroke="#74c69d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M256 215 C 212 220, 162 235, 112 205" stroke="#74c69d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M256 260 C 212 270, 157 290, 117 260" stroke="#74c69d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M256 305 C 217 320, 172 345, 137 320" stroke="#74c69d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M256 350 C 227 365, 197 390, 172 375" stroke="#74c69d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M256 395 C 237 405, 222 425, 207 420" stroke="#74c69d" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
